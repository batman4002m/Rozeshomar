<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050816">
<title>روز شمار 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene">
  <div class="stars"></div><div class="aurora a1"></div><div class="aurora a2"></div>
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
</div>
<main>
<header class="hero glass">
  <div class="mini">SMART COUNTDOWN • IRAN CALENDAR</div>
  <h1>روز شمار <span>3D</span></h1>
  <p id="today">در حال بارگذاری...</p>
  <div class="live"><i></i> شمارش زنده</div>
</header>

<nav class="filters">
<button class="active" data-filter="all">همه</button><button data-filter="school">مدرسه</button>
<button data-filter="season">فصل‌ها</button><button data-filter="calendar">تقویم</button>
</nav>

<section id="cards" class="cards"></section>

<section class="glass info">
<div class="info-orb">💧</div>
<div><b>نوار مایع هوشمند</b><p>رنگ مایع با نزدیک شدن به تاریخ تغییر می‌کند و در روز رویداد به حالت کامل و سبز درمی‌آید.</p></div>
</section>
<footer>Create by Batman</footer>
</main>
<script src="app.js"></script>
</body>
</html>
